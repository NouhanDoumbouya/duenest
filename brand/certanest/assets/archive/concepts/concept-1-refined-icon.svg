<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="CertaNest">
  <title>CertaNest — Secure Nest mark, refined (icon)</title>
  <!-- Outer protective wall: rises vertically, then cradles in at the base -->
  <path d="M11 19 C11 39 15 45 32 45 C49 45 53 39 53 19" stroke="#0F766E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner wall: consistent 6px offset for a layered vault-nest -->
  <path d="M17 22 C17 36 20 39 32 39 C44 39 47 36 47 22" stroke="#0F766E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <!-- Nested certainty checkmark: ~15% smaller, centered, no longer dominant -->
  <path d="M25.5 28 L30 33 L40 20" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
