name: CI

# PAUSED: automatic runs are disabled to avoid GitHub Actions charges while
# billing is turned off on the account. CI is manual-only for now
# (Actions tab → "Run workflow"). To re-enable automatic CI once billing is
# restored, uncomment the `pull_request` and `push` triggers below.
on:
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches: [main]

# Cancel an in-progress run for the same PR/branch when a new commit is pushed,
# so we don't waste CI minutes on stale commits. We do NOT cancel on `main`:
# every commit to the default branch should be fully tested, and cancelling
# rapid back-to-back merges produced "no jobs were run" failure emails.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests run against the dedicated testing settings (ephemeral in-memory
      # encryption keys, manual billing allowed, fast password hasher). The test
      # runner builds its own SQLite database, so no DATABASE_URL / Postgres
      # service is needed here.
      DJANGO_SETTINGS_MODULE: config.settings.testing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches backend/runtime.txt (python-3.12.8) and the Dockerfile base.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system packages (OCR / PDF tooling)
        # tesseract-ocr + poppler-utils back pytesseract/pdf2image, mirroring the
        # production Dockerfile so document-intelligence code paths import and run
        # the same way in CI as in production.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        # Fails if a model change was committed without its migration.
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: python manage.py test --verbosity=2

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 20 LTS — compatible with Next 16 and the project's @types/node ^20.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` installs exactly from package-lock.json (reproducible builds).
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        # Next's production build doubles as the TypeScript type-check.
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: System packages (OCR / PDF tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate + seed the E2E test user
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          python manage.py migrate --noinput
          python manage.py shell -c "
          from django.contrib.auth import get_user_model
          U = get_user_model()
          u, _ = U.objects.get_or_create(email='verify@example.com', defaults={'username':'verify','is_staff':True,'is_superuser':True})
          u.username='verify'; u.is_staff=True; u.is_superuser=True; u.is_active=True
          [setattr(u, f, True) for f in ['email_verified'] if hasattr(u, f)]
          u.set_password('VerifyPass123!'); u.save()
          print('seeded', u.email)"

      - name: Start backend
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          nohup python manage.py runserver 127.0.0.1:8010 --noreload > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8010/api/v1/features/ >/dev/null && break || sleep 1
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build + start frontend (same-origin proxy)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          BACKEND_ORIGIN: http://127.0.0.1:8010
        run: |
          npm run build
          nohup npm run start -- -p 3010 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3010/login >/dev/null && break || sleep 1
          done

      - name: Run E2E tests
        working-directory: frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3010
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
