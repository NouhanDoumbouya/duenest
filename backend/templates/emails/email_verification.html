{% extends "emails/base.html" %}
{% block preheader %}{{ subject }}{% endblock %}
{% block content %}
<h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#0B1220;">{{ subject }}</h1>
<p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#475569;">{{ email_body|linebreaksbr }}</p>
<a href="{{ verify_url }}" style="display:inline-block;border-radius:8px;background:#0f766e;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;padding:12px 18px;">Verify email</a>
{% endblock %}
{% block footer %}If you didn't create a CertaNest account, you can ignore this email.{% endblock %}
